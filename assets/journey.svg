<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Journey: phone and Termux, COVID lockdown lab, teaching on campus, Thothsparkz at 18, Red Team Labs, Gritstone at 19, a pause at 21, AI Security Engineer at EY at 22">
  <defs>
