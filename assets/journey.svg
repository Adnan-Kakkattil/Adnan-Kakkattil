    <text x="365" y="178" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#ece8df">Offensive Fundamentals</text>
    <text x="365" y="202" text-anchor="middle" class="sans" font-size="13" fill="#9a978e">Linux, tooling, phishing &amp;</text>
