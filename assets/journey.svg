<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Journey: phone and Termux, offensive fundamentals, VAPT and web security, educator, AI Security at EY">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.6s cubic-bezier(.2,.7,.1,1) .2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .n { opacity: 0; animation: pop .6s ease forwards; }
      .n1 { animation-delay: .3s } .n2 { animation-delay: .8s } .n3 { animation-delay: 1.3s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.3s }
      @keyframes pop { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      .halo { animation: halo 2s ease-out 2.8s infinite; transform-origin: 1070px 110px; transform-box: view-box; opacity: 0; }
      @keyframes halo { 0% { opacity: .8; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="279" rx="20" fill="#0a0b09" stroke="#ece8df" stroke-opacity=".12"/>
