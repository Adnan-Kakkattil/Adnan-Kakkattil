<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Terminal: whoami  Adnan Kakkattil, AI Security at EY">
  <defs>
    <style>
      .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 15px; }
      .p { fill: #c8ff3d; } .c { fill: #ece8df; } .o { fill: #9a978e; } .k { fill: #6fe3ff; } .w { fill: #ffb547; }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151813"/><stop offset="1" stop-color="#0d0f0c"/>
    </linearGradient>
    <clipPath id="t1"><rect x="40" y="80" height="26" width="0"><animate attributeName="width" from="0" to="400" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="40" y="140" height="26" width="0"><animate attributeName="width" from="0" to="400" begin="1.8s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="40" y="200" height="26" width="0"><animate attributeName="width" from="0" to="400" begin="3.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="40" y="260" height="26" width="0"><animate attributeName="width" from="0" to="400" begin="4.8s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="40" y="320" height="26" width="0"><animate attributeName="width" from="0" to="400" begin="6.2s" dur="0.7s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="438" rx="16" fill="url(#g)" stroke="#ece8df" stroke-opacity=".14"/>
  <path d="M1 48h898" stroke="#ece8df" stroke-opacity=".1"/>
  <circle cx="28" cy="25" r="6" fill="#ff5a4e"/><circle cx="48" cy="25" r="6" fill="#ffb547"/><circle cx="68" cy="25" r="6" fill="#c8ff3d"/>
  <text x="870" y="30" text-anchor="end" class="m o" font-size="13">adnan@journey: ~</text>

  <g class="m">
    <text x="40" y="99" clip-path="url(#t1)"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
    <text x="40" y="125" class="o" opacity="0">adnan_kakkattil  <tspan class="k"># builder · researcher · teacher · defender</tspan>
      <set attributeName="opacity" to="1" begin="1.1s" fill="freeze"/></text>

    <text x="40" y="159" clip-path="url(#t2)"><tspan class="p">$</tspan> <tspan class="c">cat origin.txt</tspan></text>
    <text x="40" y="185" class="o" opacity="0">started=<tspan class="w">6th_standard</tspan>  device=phone’tablet  tools=termux,linux  lab=<tspan class="w">none</tspan>
      <set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/></text>

    <text x="40" y="219" clip-path="url(#t3)"><tspan class="p">$</tspan> <tspan class="c">ls ./research</tspan></text>
    <text x="40" y="245" class="k" opacity="0">sqli/  idor/  broken-auth/  info-disclosure/  vuln-chains/  llm-prompt-injection/
      <set attributeName="opacity" to="1" begin="4.1s" fill="freeze"/></text>

    <text x="40" y="279" clip-path="url(#t4)"><tspan class="p">$</tspan> <tspan class="c">echo $ROLE</tspan></text>
    <text x="40" y="305" class="c" opacity="0" font-weight="700">AI Security @ EY
      <set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/></text>

    <text x="40" y="339" clip-path="url(#t5)"><tspan class="p">$</tspan> <tspan class="c">./teach --lang=malayalam</tspan></text>
    <text x="40" y="365" class="o" opacity="0">Advanced Practical Ethical Hacking  <tspan class="p"> 100+ students</tspan>  <tspan class="o">· ZyrOps Academy</tspan>
      <set attributeName="opacity" to="1" begin="7.1s" fill="freeze"/></text>

    <text x="40" y="405" opacity="0"><tspan class="p">$</tspan> <tspan class="c">I build, research, teach, and secure technology.</tspan> <tspan class="p">ˆ<animate attributeName="opacity" values="1;0;1" dur="1s" begin="7.8s" repeatCount="indefinite"/></tspan>
      <set attributeName="opacity" to="1" begin="7.8s" fill="freeze"/></text>
  </g>
</svg>
