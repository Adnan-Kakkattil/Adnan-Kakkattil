      @keyframes pop { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      .halo { animation: halo 2s ease-out 3.2s infinite; transform-origin: 1110px 110px; transform-box: view-box; opacity: 0; }
