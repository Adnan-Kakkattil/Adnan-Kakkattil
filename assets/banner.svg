<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Adnan Kakkattil  I build, research, teach and secure technology">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ece8df" stroke-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="35%" r="55%">
      <stop offset="0" stop-color="#c8ff3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c8ff3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ff3d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8ff3d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c8ff3d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .up { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.1,1) forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .8s } .d5 { animation-delay: 1.1s }
      @keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-140px) } to { transform: translateY(380px) } }
      .ping { animation: ping 2s ease-out infinite; transform-origin: 70px 62px; transform-box: view-box; }
      @keyframes ping { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(3.2) } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .ring { transform-origin: 1010px 180px; transform-box: view-box; animation: spin 40s linear infinite; }
      .ring2 { transform-origin: 1010px 180px; transform-box: view-box; animation: spin 24s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0a0b09"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect class="scan" width="1200" height="120" fill="url(#scan)"/>

    <!-- status -->
    <g class="up d1">
      <circle class="ping" cx="70" cy="62" r="5" fill="#c8ff3d"/>
      <circle cx="70" cy="62" r="5" fill="#c8ff3d"/>
      <text x="86" y="67" class="mono" font-size="14" fill="#c8ff3d" letter-spacing="1.5">// AI SECURITY · EY  KERALA, INDIA</text>
    </g>

    <!-- name -->
    <text x="60" y="160" class="sans up d2" font-size="84" font-weight="800" fill="#ece8df" letter-spacing="-4">Adnan Kakkattil</text>

    <!-- tagline -->
    <g class="up d3">
      <text x="62" y="218" class="sans" font-size="30" font-weight="600" fill="#9a978e" letter-spacing="-1">I build, research, teach &amp;</text>
      <rect x="400" y="190" width="166" height="40" rx="4" fill="#c8ff3d" transform="rotate(-1.5 483 210)"/>
      <text x="410" y="219" class="sans" font-size="30" font-weight="800" fill="#0a0b09" letter-spacing="-1" transform="rotate(-1.5 483 210)">secure</text>
      <text x="578" y="218" class="sans" font-size="30" font-weight="600" fill="#9a978e" letter-spacing="-1">technology.</text>
    </g>

    <!-- chips -->
    <g class="up d4 mono" font-size="13">
      <rect x="60" y="262" width="150" height="34" rx="17" fill="none" stroke="#ece8df" stroke-opacity=".2"/>
      <text x="135" y="284" text-anchor="middle" fill="#ece8df">AI Security</text>
      <rect x="220" y="262" width="210" height="34" rx="17" fill="none" stroke="#ece8df" stroke-opacity=".2"/>
      <text x="325" y="284" text-anchor="middle" fill="#ece8df">Vulnerability Research</text>
      <rect x="440" y="262" width="190" height="34" rx="17" fill="none" stroke="#ece8df" stroke-opacity=".2"/>
      <text x="535" y="284" text-anchor="middle" fill="#ece8df">Full-Stack &amp; AI Eng</text>
      <rect x="640" y="262" width="150" height="34" rx="17" fill="#c8ff3d" fill-opacity=".12" stroke="#c8ff3d" stroke-opacity=".4"/>
      <text x="715" y="284" text-anchor="middle" fill="#c8ff3d">Educator</text>
    </g>

    <!-- emblem -->
    <g class="up d5">
      <circle class="ring" cx="1010" cy="180" r="118" fill="none" stroke="#c8ff3d" stroke-opacity=".35" stroke-dasharray="4 10"/>
      <circle class="ring2" cx="1010" cy="180" r="92" fill="none" stroke="#ece8df" stroke-opacity=".15" stroke-dasharray="60 20"/>
      <rect x="950" y="120" width="120" height="120" rx="28" fill="#c8ff3d"/>
      <text x="1010" y="200" text-anchor="middle" class="sans" font-size="56" font-weight="800" fill="#0a0b09" letter-spacing="-4">AK</text>
      <text x="1010" y="330" text-anchor="middle" class="mono" font-size="13" fill="#9a978e">adnan@journey:~$ <tspan fill="#c8ff3d" class="blink">ˆ</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="24" fill="none" stroke="#ece8df" stroke-opacity=".12"/>
</svg>
